---
slurm::source_dependencies:
  - bzip2
  - gcc
  - g++
  - make
  - libperl-dev
  - libmunge-dev
  - libreadline-dev
  - libnuma-dev
  - libpam0g-dev
  - libglib2.0-dev
  - libhwloc-dev
  - libssl-dev
  - libcurl4-openssl-dev
  - libcgroup-dev
  - libdbus-1-dev
  - liblz4-dev
  - libfreeipmi-dev
  - python3
  - libmariadbd-dev
  - libhttp-parser-dev
  - libjson-c-dev
  - libjwt-dev
  - libyaml-dev
slurm::env_dir: /etc/default
slurm::slurmrestd_user_group: nogroup
slurm::slurm_user_shell: /usr/sbin/nologin
slurm::base_install_packages:
  - slurm-smd
  - slurm-smd-client
  - slurm-smd-dev
  - slurm-smd-libslurm-perl
  - slurm-smd-libpmi0
  - slurm-smd-libpmi2-0
slurm::slurmd_install_packages:
  - slurm-smd-slurmd
slurm::slurmctld_install_packages:
  - slurm-smd-slurmctld
slurm::slurmdbd_install_packages:
  - slurm-smd-slurmdbd
slurm::pam_install_packages:
  - slurm-smd-libpam-slurm-adopt
slurm::torque_install_packages:
  - slurm-smd-torque
